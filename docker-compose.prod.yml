# Production / server compose — pulls pre-built image from GHCR (no local build).
# Copy this file to the deploy server as /opt/iot-leakage/docker-compose.yml
# Replace YOUR_GITHUB_USERNAME with your lowercase GitHub username/org.

services:
  db:
    image: mysql:8.0
    container_name: iot-leakage-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: leakage_of_authorization
    volumes:
      - mysql_data:/var/lib/mysql
      # On first boot, place Database.txt + 01-init.sh next to this compose file
      - ./Database.txt:/schema/Database.txt:ro
      - ./01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    image: ghcr.io/YOUR_GITHUB_USERNAME/iot-leakage-app:latest
    container_name: iot-leakage-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: leakage_of_authorization
      DB_USER: root
      DB_PASSWORD: root

volumes:
  mysql_data:
