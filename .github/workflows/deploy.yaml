name: Build and Deploy IoT Leakage App

on:
  # push:
  #   branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy to server over SSH (requires secrets)"
        type: boolean
        default: false

env:
  IMAGE_NAME: iot-leakage-app
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker image and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server over SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    # Opt-in: Actions → Run workflow → enable "Also deploy"
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            OWNER="${{ github.repository_owner }}"
            IMAGE="ghcr.io/${OWNER}/iot-leakage-app:latest"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${OWNER}" --password-stdin
            docker pull "${IMAGE}"

            mkdir -p /opt/iot-leakage
            cd /opt/iot-leakage

            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.prod.yml pull || true
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            elif [ -f docker-compose.yml ]; then
              docker compose pull || true
              docker compose up -d --remove-orphans
            else
              docker stop iot-leakage-app || true
              docker rm iot-leakage-app || true
              docker run -d --name iot-leakage-app \
                -e DB_HOST=127.0.0.1 \
                -e DB_PORT=3306 \
                -e DB_NAME=leakage_of_authorization \
                -e DB_USER=root \
                -e DB_PASSWORD=root \
                -p 8080:8080 \
                "${IMAGE}"
            fi

            echo "Deploy finished at $(date -u)"
